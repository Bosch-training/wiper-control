name: cicd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build (host, C99)
        run: make build

      - name: Unit tests (host)
        run: make test

  code-quality:
    name: Code Quality Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install static analysis tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy

      - name: Lint (Cppcheck + MISRA add-on, clang-tidy)
        run: make lint

  hex:
    name: Hex Image (optional)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Best-effort: RH850 cross-toolchain/MCU are not yet selected
      # (AGENTS.md Section 7). This step skips with a clear message
      # instead of failing the pipeline until the toolchain is pinned.
      - name: Attempt hex generation
        run: make hex

      - name: Upload hex artifact
        if: hashFiles('build/app.hex') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-hex
          path: build/app.hex

  deploy:
    name: Deploy to EC2
    needs: [hex, code-quality]
    # Only deploy from main (push or manual run), never from a PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # StrictHostKeyChecking is disabled per project decision (host key
      # pinning not set up yet); this accepts any host key and is open to
      # MITM risk, so only point EC2_HOST at a trusted, known instance.
      - name: Write deploy marker over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/deploy_key "${EC2_USER:-ubuntu}@${EC2_HOST}" \
            "echo \"\$(date -u +%Y-%m-%dT%H:%M:%SZ) hello world\" > /home/ubuntu/deploy-info.txt"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
